name: Build exact Android v0.3.16

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-door-slam-v0313
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Recover exact v0.3.15 and generate v0.3.16
        run: |
          python3 tools/recover_exact_v0315.py
          python3 tools/build_exact_v0316.py

      - name: Verify exact 3.15 interactions, no music, and door SFX
        run: |
          node --check android-exact-v0316/app/src/main/assets/game/game.js
          node --check android-exact-v0316/app/src/main/assets/game/sfx-v0316.js
          grep -F 'emptyFrameExamined: false' android-exact-v0316/app/src/main/assets/game/game.js
          grep -F 'floorPlanBedroomCompared: false' android-exact-v0316/app/src/main/assets/game/game.js
          grep -F 'hallLightSwitchChecked: false' android-exact-v0316/app/src/main/assets/game/game.js
          grep -F 'const doorSlams = f.windowOpen;' android-exact-v0316/app/src/main/assets/game/game.js
          grep -F 'window.__WTHK_SFX__?.playDoorSlam();' android-exact-v0316/app/src/main/assets/game/game.js
          grep -F 'const DOOR_SLAM_VOLUME = 0.05;' android-exact-v0316/app/src/main/assets/game/sfx-v0316.js
          test -f android-exact-v0316/app/src/main/assets/game/audio/bedroom-door-slam.mp3
          ! find android-exact-v0316/app/src/main/assets/game -type f | grep -Ei 'one-last-morning|music-v'
          ! grep -R -Ei 'one-last-morning|music-v0313' android-exact-v0316/app/src/main/assets/game

      - name: Generate Gradle wrapper
        run: gradle -p android-exact-v0316 wrapper --gradle-version 8.11.1

      - name: Build debug APK
        working-directory: android-exact-v0316
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Package and inspect APK
        run: |
          mkdir -p deliverables
          cp android-exact-v0316/app/build/outputs/apk/debug/app-debug.apk deliverables/WhatTheHouseKept-v0.3.16-NO-MUSIC-door-slam-debug.apk
          (cd android-exact-v0316 && zip -qr ../deliverables/WhatTheHouseKept-AndroidStudio-v0.3.16-NO-MUSIC-DOOR-SLAM.zip . -x '.gradle/*' 'app/build/*' 'build/*')
          unzip -l deliverables/WhatTheHouseKept-v0.3.16-NO-MUSIC-door-slam-debug.apk > deliverables/apk-contents.txt
          grep -F 'assets/game/audio/bedroom-door-slam.mp3' deliverables/apk-contents.txt
          grep -F 'assets/game/sfx-v0316.js' deliverables/apk-contents.txt
          if grep -Ei 'one-last-morning|music-v0313' deliverables/apk-contents.txt; then echo 'Music unexpectedly bundled'; exit 1; fi
          sha256sum deliverables/*.apk deliverables/*.zip > deliverables/SHA256SUMS.txt

      - name: Upload exact corrected build
        uses: actions/upload-artifact@v4
        with:
          name: WhatTheHouseKept-v0.3.16-exact-no-music
          path: deliverables/
          if-no-files-found: error
          retention-days: 30
