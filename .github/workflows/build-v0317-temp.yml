name: Build exact Android v0.3.17

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-door-slam-v0313
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Generate exact v0.3.17 project
        run: |
          python3 tools/build_exact_v0317.py
          python3 - <<'PY'
          from pathlib import Path
          game = Path('android-exact-v0317/app/src/main/assets/game/game.js')
          text = game.read_text(encoding='utf-8')
          if 'Jesus Christ.' not in text:
              raise SystemExit('Expected previous reaction not found')
          game.write_text(text.replace('Jesus Christ.', 'Shit.', 1), encoding='utf-8')
          readme = Path('android-exact-v0317/README-v0.3.17.txt')
          r = readme.read_text(encoding='utf-8')
          readme.write_text(r.replace('Jesus Christ.', 'Shit.', 1), encoding='utf-8')
          PY

      - name: Verify no music, exact interactions, SFX, and spoken reaction
        run: |
          test ! -f android-exact-v0317/app/src/main/assets/game/music-v0313.js
          test ! -f android-exact-v0317/app/src/main/assets/game/audio/one-last-morning-loop.mp3
          test -f android-exact-v0317/app/src/main/assets/game/audio/bedroom-door-slam.mp3
          node --check android-exact-v0317/app/src/main/assets/game/game.js
          node --check android-exact-v0317/app/src/main/assets/game/sfx-v0317.js
          grep -F 'Shit.' android-exact-v0317/app/src/main/assets/game/game.js
          grep -F 'Right. Window.' android-exact-v0317/app/src/main/assets/game/game.js
          ! grep -F 'Jesus Christ.' android-exact-v0317/app/src/main/assets/game/game.js
          grep -F 'emptyFrameBackChecked: false' android-exact-v0317/app/src/main/assets/game/game.js
          grep -F 'hallBulbChecked: false' android-exact-v0317/app/src/main/assets/game/game.js
          ! grep -R "one-last-morning\|music-v0313" android-exact-v0317/app/src/main/assets/game

      - name: Generate Gradle wrapper
        run: gradle -p android-exact-v0317 wrapper --gradle-version 8.11.1

      - name: Build debug APK
        working-directory: android-exact-v0317
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Package and inspect APK
        run: |
          mkdir -p deliverables
          cp android-exact-v0317/app/build/outputs/apk/debug/app-debug.apk deliverables/WhatTheHouseKept-v0.3.17-VERBAL-REACTION-debug.apk
          (cd android-exact-v0317 && zip -qr ../deliverables/WhatTheHouseKept-AndroidStudio-v0.3.17-VERBAL-REACTION.zip . -x '.gradle/*' 'app/build/*' 'build/*')
          unzip -l deliverables/WhatTheHouseKept-v0.3.17-VERBAL-REACTION-debug.apk > deliverables/apk-contents.txt
          grep -F 'assets/game/audio/bedroom-door-slam.mp3' deliverables/apk-contents.txt
          grep -F 'assets/game/sfx-v0317.js' deliverables/apk-contents.txt
          if grep -E 'one-last-morning|music-v0313' deliverables/apk-contents.txt; then echo 'Music unexpectedly bundled'; exit 1; fi
          sha256sum deliverables/*.apk deliverables/*.zip > deliverables/SHA256SUMS.txt

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: WhatTheHouseKept-v0.3.17-verbal-reaction
          path: deliverables/
          if-no-files-found: error
          retention-days: 30
