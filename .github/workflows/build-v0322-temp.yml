name: Build exact Android v0.3.22

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-door-slam-v0313
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Generate exact v0.3.22 project
        run: python3 tools/build_exact_v0322.py

      - name: Verify ensuite parser and preserved game state
        run: |
          node --check android-exact-v0317/app/src/main/assets/game/game.js
          node --check android-exact-v0317/app/src/main/assets/game/sfx-v0322.js
          node tools/test_ensuite_v0322.js android-exact-v0317/app/src/main/assets/game/game.js
          grep -F 'const BUILD_VERSION = "v0.3.22";' android-exact-v0317/app/src/main/assets/game/game.js
          grep -F 'medicineCabinetOpen: false' android-exact-v0317/app/src/main/assets/game/game.js
          grep -F 'showerCurtainOpen: false' android-exact-v0317/app/src/main/assets/game/game.js
          grep -F 'bathroomVentRemoved: false' android-exact-v0317/app/src/main/assets/game/game.js
          grep -F 'safetyPinTaken: false' android-exact-v0317/app/src/main/assets/game/game.js
          grep -F 'hairbrushDiscarded: false' android-exact-v0317/app/src/main/assets/game/game.js
          grep -F 'two plausible cabinets' android-exact-v0317/app/src/main/assets/game/game.js
          grep -F 'Which brush?' android-exact-v0317/app/src/main/assets/game/game.js
          grep -F 'jennifer brush' android-exact-v0317/app/src/main/assets/game/game.js
          grep -F '"behind stool"' android-exact-v0317/app/src/main/assets/game/game.js
          grep -F 'use screwdriver' android-exact-v0317/app/src/main/assets/game/game.js
          grep -F 'not putting an electrical appliance into water' android-exact-v0317/app/src/main/assets/game/game.js
          grep -F 'Mira was abducted as a child and spent years being passed through a system built to train, condition, and sell people.' android-exact-v0317/app/src/main/assets/game/game.js
          grep -F '"go back to bedroom"' android-exact-v0317/app/src/main/assets/game/game.js
          test -f android-exact-v0317/app/src/main/assets/game/audio/bedroom-door-slam.mp3
          test ! -f android-exact-v0317/app/src/main/assets/game/audio/one-last-morning-loop.mp3
          ! grep -R "one-last-morning\|music-v0313" android-exact-v0317/app/src/main/assets/game

      - name: Generate Gradle wrapper
        run: gradle -p android-exact-v0317 wrapper --gradle-version 8.11.1

      - name: Build debug APK
        working-directory: android-exact-v0317
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Package and inspect APK
        run: |
          mkdir -p deliverables
          cp android-exact-v0317/app/build/outputs/apk/debug/app-debug.apk deliverables/WhatTheHouseKept-v0.3.22-ENSUITE-PARSER-debug.apk
          (cd android-exact-v0317 && zip -qr ../deliverables/WhatTheHouseKept-AndroidStudio-v0.3.22-ENSUITE-PARSER.zip . -x '.gradle/*' 'app/build/*' 'build/*')
          unzip -l deliverables/WhatTheHouseKept-v0.3.22-ENSUITE-PARSER-debug.apk > deliverables/apk-contents.txt
          grep -F 'assets/game/audio/bedroom-door-slam.mp3' deliverables/apk-contents.txt
          grep -F 'assets/game/sfx-v0322.js' deliverables/apk-contents.txt
          if grep -E 'one-last-morning|music-v0313' deliverables/apk-contents.txt; then echo 'Music unexpectedly bundled'; exit 1; fi
          sha256sum deliverables/*.apk deliverables/*.zip > deliverables/SHA256SUMS.txt

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: WhatTheHouseKept-v0.3.22-ensuite-parser
          path: deliverables/
          if-no-files-found: error
          retention-days: 30
