name: Build exact Android v0.3.23

on:
  push:
    branches:
      - android-door-slam-v0313
    paths:
      - .github/workflows/build-v0323-temp.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-door-slam-v0313

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate exact v0.3.23 project
        run: python3 tools/build_exact_v0323.py

      - name: Verify source JavaScript and parser regressions
        shell: bash
        run: |
          set -euo pipefail
          GAME="android-exact-v0317/app/src/main/assets/game/game.js"
          node --check "$GAME"
          node tools/test_ensuite_v0322.js "$GAME"
          node tools/test_ensuite_v0323.js "$GAME"
          grep -F 'const BUILD_VERSION = "v0.3.23";' "$GAME"
          grep -F 'Bernard is still a plunger' "$GAME"
          grep -F 'versionCode 11' android-exact-v0317/app/build.gradle
          grep -F 'versionName "0.3.23"' android-exact-v0317/app/build.gradle
          test ! -f android-exact-v0317/app/src/main/assets/game/audio/one-last-morning-loop.mp3
          test ! -f android-exact-v0317/app/src/main/assets/game/music-v0313.js
          test -f android-exact-v0317/app/src/main/assets/game/audio/bedroom-door-slam.mp3

      - name: Build debug APK
        shell: bash
        working-directory: android-exact-v0317
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Inspect packaged APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android-exact-v0317/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" > /tmp/apk-list.txt
          grep -F 'assets/game/audio/bedroom-door-slam.mp3' /tmp/apk-list.txt
          grep -F 'assets/game/sfx-v0323.js' /tmp/apk-list.txt
          if grep -Fq 'one-last-morning' /tmp/apk-list.txt; then echo 'Opening music unexpectedly packaged'; exit 1; fi
          if grep -Fq 'assets/game/music-v0313.js' /tmp/apk-list.txt; then echo 'Old music controller unexpectedly packaged'; exit 1; fi
          unzip -p "$APK" assets/game/game.js > /tmp/apk-game.js
          node --check /tmp/apk-game.js
          node tools/test_ensuite_v0322.js /tmp/apk-game.js
          node tools/test_ensuite_v0323.js /tmp/apk-game.js
          grep -F 'const BUILD_VERSION = "v0.3.23";' /tmp/apk-game.js
          grep -F 'Bernard is still a plunger' /tmp/apk-game.js

      - name: Package deliverables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android-exact-v0317/app/build/outputs/apk/debug/app-debug.apk dist/WhatTheHouseKept-v0.3.23-FUNNY-ENSUITE-debug.apk
          (cd android-exact-v0317 && zip -qr ../dist/WhatTheHouseKept-AndroidStudio-v0.3.23-FUNNY-ENSUITE.zip . -x 'app/build/*' '.gradle/*')
          sha256sum dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: WhatTheHouseKept-v0.3.23-funny-ensuite
          path: dist/
          if-no-files-found: error
