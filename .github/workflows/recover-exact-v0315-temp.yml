name: Recover exact v0.3.15 temporarily

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-door-slam-v0313
          fetch-depth: 0

      - name: Recover exact v0.3.15 runtime source
        run: python3 tools/recover_exact_v0315.py

      - name: Commit recovered source to temporary branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recovered-v0315/game-v0315.js recovered-v0315/snippets.txt
          git commit -m "Recover exact v0.3.15 interaction source" || exit 0
          git push origin HEAD:android-door-slam-v0313
