name: Recover v0.3.13 source temporarily

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-door-slam-v0313
          fetch-depth: 0

      - name: Recover exact v0.3.13 source
        run: python3 tools/recover_v0313.py

      - name: Commit recovered source to temporary branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recovered/game-v0313.js recovered/transition-snippets.txt
          git commit -m "Recover exact v0.3.13 game source" || exit 0
          git push origin HEAD:android-door-slam-v0313
